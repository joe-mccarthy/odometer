name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  POETRY_VERSION: "2.4.1"

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==${POETRY_VERSION}"
          poetry --version

      - name: Validate release tag
        run: |
          PROJECT_VERSION="$(poetry version --short)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Release workflow must run from a version tag." >&2
            exit 1
          fi

          if [ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${PROJECT_VERSION}." >&2
            exit 1
          fi

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Lint
        run: poetry run ruff check .

      - name: Type check
        run: poetry run mypy odometer

      - name: Test
        run: poetry run pytest

      - name: Build package
        run: poetry build

      - name: Create checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "Odometer ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
