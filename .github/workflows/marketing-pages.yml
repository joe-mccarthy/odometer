name: Publish Odometer marketing site

# Publishing requires separate authorization before manually starting this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload marketing site
        uses: actions/upload-pages-artifact@v3
        with:
          path: marketing/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
