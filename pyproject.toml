[tool.poetry]
name = "odometer"
version = "0.1.0"
description = "A local-first CLI/TUI application for tracking the true cost of vehicle ownership."
authors = ["Joe McCarthy"]
license = "GPL-3.0-only"
readme = "README.md"
packages = [{ include = "odometer" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
typer = ">=0.16.0,<1.0.0"
textual = ">=3.0.0,<7.0.0"
sqlmodel = ">=0.0.24,<1.0.0"
platformdirs = ">=4.0.0,<5.0.0"
rich = ">=13.0.0,<15.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"
pytest-cov = ">=6.0.0,<8.0.0"
ruff = ">=0.12.0,<1.0.0"
mypy = ">=1.10.0,<2.0.0"
pre-commit = ">=4.0.0,<5.0.0"
textual-dev = ">=1.0.0,<2.0.0"

[tool.poetry.scripts]
odometer = "odometer.main:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "--cov=odometer --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
pretty = true
